name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ${{ matrix.check }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        check: [format, security, lint, test, coverage, fuzz]
    steps:
      - uses: actions/checkout@v4
        with:
          path: teez-core

      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/Shared-Cpp
          path: teez-core/Shared-Cpp

      - name: Install dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome*.list
          for attempt in 1 2 3; do
            sudo apt-get update && break
            sleep 5
          done
          sudo apt-get install -y \
            build-essential \
            clang \
            clang-format \
            clang-tidy \
            cmake \
            cppcheck \
            curl \
            gcovr \
            libcurl4-openssl-dev \
            liblua5.4-dev \
            lua5.4 \
            ninja-build \
            pkg-config \
            python3-pytest \
            zlib1g-dev

      - name: Run ${{ matrix.check }}
        working-directory: teez-core
        env:
          BUILD_DIR: /tmp/teez-core-ci-${{ matrix.check }}-build
          FUZZ_BUILD_DIR: /tmp/teez-core-ci-fuzz-build
          TMPDIR: /tmp/teez-core-ci-${{ matrix.check }}-tmp
          CCACHE_DISABLE: 1
          FUZZ_SECONDS: 30
          COVERAGE_MIN: 79
        run: |
          chmod +x scripts/ci.sh
          ./scripts/ci.sh ${{ matrix.check }}
